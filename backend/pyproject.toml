[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foghorn"
version = "0.4.0"
description = "Backend for foghorn — a Bay Area music & jazz show aggregator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Versions pinned exactly per the Phase 1.1 ticket. Bump deliberately; the
# `make gate` run is the safety net. APScheduler is held on the 3.x line
# (4.x is a different API).
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.47.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.14.3",
    "apscheduler==3.11.2",
    "pydantic==2.13.4",
    "icalendar==7.1.2",
    "recurring-ical-events==3.8.2",
    # Apple Vision — the default OCR engine on macOS (see foghorn/ocr).
    # Darwin-only: the nightly scrape runs on a Mac; CI (ubuntu) skips these
    # and exercises the pure parser from checked-in OCR fixtures. Non-mac
    # hosts use the `rapidocr` extra instead.
    "pyobjc-framework-Vision==12.2.1; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz==12.2.1; sys_platform == 'darwin'",
]

[project.scripts]
# The MCP server (foghorn.mcp.server) — stdio, wraps the running API.
foghorn-mcp = "foghorn.mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.14",
    "mypy==2.1.0",
    # `mcp` is a runtime dependency of foghorn-mcp, but it lives here rather
    # than in [project.dependencies] so the scrape/API deployment doesn't
    # carry it. `make install` runs `pip install -e ".[dev]"` and CI runs
    # `make install`, so this is also what makes tests/mcp importable in CI —
    # a bare [mcp] extra would leave CI without it and fail every MCP test at
    # import.
    "mcp==1.29.1",
]
# Cross-platform OCR engine (FOGHORN_OCR_ENGINE=rapidocr; the default off
# macOS) — for hosting the scraper somewhere Apple Vision doesn't exist.
rapidocr = [
    "rapidocr-onnxruntime==1.4.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/foghorn"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "W",   # pycodestyle warnings
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["foghorn"]
strict = true
warn_unused_configs = true

# recurring-ical-events and apscheduler ship no py.typed marker (icalendar,
# httpx, and bs4 do).
[[tool.mypy.overrides]]
module = ["recurring_ical_events.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
